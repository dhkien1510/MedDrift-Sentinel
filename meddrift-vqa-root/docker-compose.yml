services:
  frontend:
    build: ./meddrift-frontend
    ports:
      - "3000:5173"
    stdin_open: true
    volumes:
      - ./meddrift-frontend/src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  service:
    build: ./meddrift-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./meddrift-ai-service:/app
      - ./configs:/configs
      - ./data:/data
      - ./hf_cache:/root/.cache/huggingface
    env_file:
      - ./meddrift-ai-service/.env
    depends_on:
      - mongodb
      - redis
      - minio
    environment:
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASS}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER}
      - MINIO_SECRET_KEY=${MINIO_PASS}
      - MEDDRIFT_CACHE_DIR=/tmp/meddrift_cache

  backend:
    build: ./meddrift-server
    ports:
      - "5000:5000"
    volumes:
      - ./meddrift-server:/app
    environment:
      - PORT=5000
      - FASTAPI_URL=http://service:8000
      - MONGO_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017/?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASS}
    depends_on:
      - service
      - mongodb
      - redis
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASS}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --appendonly yes
      --appendfsync everysec

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASS}
    command: server /data --console-address ":9001"

volumes:
  mongo_data:
  redis_data:    
  minio_data: